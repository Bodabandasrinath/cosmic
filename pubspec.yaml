
name: cosmic
description: "Cosmic — Production-ready Android Chat, Photo Sharing, Voice & Video Calling App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase Suite
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4

  # State Management
  provider: ^6.1.2

  # Real-time Voice & Video Calling
  flutter_webrtc: ^0.12.12

  # Media Sharing & Audio
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  audioplayers: ^6.1.0
  record: ^5.2.0
  path_provider: ^2.1.5

  # System & Device Integrations
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5

  # UI & Styling
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  universal_io: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  record_linux: 1.3.1
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
